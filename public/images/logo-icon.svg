<svg viewBox="0 0 70 70" width="70" height="70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft sky gradient for squircle container -->
    <linearGradient id="squircleBg" x1="5" y1="5" x2="65" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Cloud mascot gradient -->
    <linearGradient id="cloudGrad" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Star tuft gradient -->
    <linearGradient id="starGrad" x1="35" y1="2" x2="35" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft shadow underneath -->
    <radialGradient id="iconShadow" cx="35" cy="62" r="24" fx="35" fy="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2A43" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F2A43" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="3" y="3" width="64" height="64" rx="20" fill="url(#squircleBg)" stroke="#38BDF8" stroke-width="2" />

  <!-- Soft Shadow -->
  <ellipse cx="35" cy="56" rx="20" ry="3.5" fill="url(#iconShadow)" />

  <!-- Glowing Star Tuft on Top -->
  <polygon points="35,6 37.5,13 44,14 39,18 40.5,25 35,21 29.5,25 31,18 26,14 32.5,13"
           fill="url(#starGrad)"
           stroke="#D97706"
           stroke-width="1.2"
           stroke-linejoin="round" />
  <circle cx="35" cy="16" r="1.8" fill="#FFFBEB" />

  <!-- Cloud Body Hero (Signature Si Awan) -->
  <path d="M 18 52
           C 10 52, 6 43, 9 36
           C 6 30, 9 23, 16 20
           C 19 14, 26 12, 33 14
           C 38 11, 46 12, 50 18
           C 58 19, 63 26, 61 33
           C 65 39, 62 48, 55 51
           C 50 54, 23 54, 18 52 Z"
        fill="url(#cloudGrad)"
        stroke="#0284C7"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Inner Top Highlight -->
  <path d="M 19 26 C 24 19, 34 17, 40 18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <ellipse cx="18" cy="38" rx="4" ry="2.5" fill="#FF8FB1" opacity="0.9" />
  <ellipse cx="52" cy="38" rx="4" ry="2.5" fill="#FF8FB1" opacity="0.9" />

  <!-- Glossy Anime Eyes -->
  <circle cx="27" cy="32" r="3.8" fill="#0F2A43" />
  <circle cx="28.5" cy="30.5" r="1.5" fill="#FFFFFF" />
  <circle cx="43" cy="32" r="3.8" fill="#0F2A43" />
  <circle cx="44.5" cy="30.5" r="1.5" fill="#FFFFFF" />

  <!-- Cheerful Smile -->
  <path d="M 31 39 C 33 43, 37 43, 39 39" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
