<svg viewBox="0 0 280 70" width="280" height="70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fullSquircleBg" x1="5" y1="5" x2="65" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="fullCloudGrad" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="fullStarGrad" x1="35" y1="2" x2="35" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="5" y="5" width="60" height="60" rx="20" fill="url(#fullSquircleBg)" stroke="#38BDF8" stroke-width="2" />

  <!-- Star Tuft on Top -->
  <polygon points="35,6 37.5,13 44,14 39,18 40.5,25 35,21 29.5,25 31,18 26,14 32.5,13"
           fill="url(#fullStarGrad)"
           stroke="#D97706"
           stroke-width="1.2"
           stroke-linejoin="round" />
  <circle cx="35" cy="16" r="1.8" fill="#FFFBEB" />

  <!-- Cloud Body Hero (Signature Si Awan) -->
  <path d="M 18 52
           C 10 52, 6 43, 9 36
           C 6 30, 9 23, 16 20
           C 19 14, 26 12, 33 14
           C 38 11, 46 12, 50 18
           C 58 19, 63 26, 61 33
           C 65 39, 62 48, 55 51
           C 50 54, 23 54, 18 52 Z"
        fill="url(#fullCloudGrad)"
        stroke="#0284C7"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Rosy Cheeks -->
  <ellipse cx="18" cy="38" rx="4" ry="2.5" fill="#FF8FB1" opacity="0.9" />
  <ellipse cx="52" cy="38" rx="4" ry="2.5" fill="#FF8FB1" opacity="0.9" />

  <!-- Anime Eyes -->
  <circle cx="27" cy="32" r="3.8" fill="#0F2A43" />
  <circle cx="28.5" cy="30.5" r="1.5" fill="#FFFFFF" />
  <circle cx="43" cy="32" r="3.8" fill="#0F2A43" />
  <circle cx="44.5" cy="30.5" r="1.5" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M 31 39 C 33 43, 37 43, 39 39" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Typography -->
  <text x="78" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0F2A43" letter-spacing="-0.5">
    Si<tspan fill="#0284C7">Hebat</tspan>
  </text>

  <!-- Flame Spark dot on letter 'i' -->
  <path d="M 90.5 17 C 92.5 13, 96.5 15, 94.5 21 C 92.5 24, 88.5 24, 90.5 17 Z" fill="#FB923C" />
  <circle cx="92" cy="21" r="1" fill="#FEF08A" />

  <!-- Tagline Pill -->
  <rect x="78" y="46" width="186" height="17" rx="5.5" fill="#E0F2FE" />
  <text x="84" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#0369A1" letter-spacing="0.4">7 KEBIASAAN ANAK INDONESIA</text>
</svg>
